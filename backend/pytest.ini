[pytest]
# Pytest configuration for TicketFlow AI

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = pytest_suite

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests across services
    slow: Tests that take longer to run
    requires_models: Tests that require trained ML models
    requires_services: Tests that require external services (MongoDB, Ollama)

# Coverage options (if pytest-cov installed)
# --cov=services
# --cov=ml
# --cov-report=html
# --cov-report=term-missing
